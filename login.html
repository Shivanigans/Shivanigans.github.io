<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>

<link rel="stylesheet" href="assets/css/ux4g.css">
<link rel="stylesheet" href="assets/css/fonts-login.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div id="app">
<div style="min-height: 100vh; background: #FAFAFA; display: flex; flex-direction: column;">

<div style="background: #FFFFFF; border-bottom: 1px solid #E5E5E5; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 32px;">
  <a href="index.html" style="display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: inherit;">
    <div aria-hidden="true" style="width: 48px; height: 48px; flex: 0 0 auto; border-radius: 999px; background: #4A2BC2; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#FAFAFA" role="presentation"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L20 8.5v7L12 19.82 4 15.5v-7L12 4.18z"></path></svg>
    </div>
    <div style="min-width: 0;">
      <div style="font-size: 12px; line-height: 16px; color: #404040;">भारत निर्वाचन आयोग</div>
      <div style="font-size: 16px; line-height: 20px; font-weight: 600; color: #4A2BC2;">Election Commission of India</div>
      <div style="font-size: 11px; line-height: 14px; color: #737373;">Citizen Service Portal</div>
    </div>
  </a>
  <div role="radiogroup" aria-label="Language" style="display: flex; align-items: center; gap: 4px; margin-left: auto;">
    <button class="ux4g-btn ux4g-btn-sm" type="button" role="radio" aria-checked="true" style="min-width: 72px; min-height: 44px; padding: 0 16px; border-radius: 4px; font-size: 12px; line-height: 16px; font-weight: 500; cursor: pointer; border: 1px solid #4A2BC2; background: #4A2BC2; color: #FAFAFA;">English</button>
    <button class="ux4g-btn ux4g-btn-sm" type="button" role="radio" aria-checked="false" style="min-width: 72px; min-height: 44px; padding: 0 16px; border-radius: 4px; font-size: 12px; line-height: 16px; font-weight: 500; cursor: pointer; border: 1px solid #D9D9D9; background: #FFFFFF; color: #171717;">हिन्दी</button>
  </div>
</div>

<main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 24px;">
  <div style="width: 100%; max-width: 440px; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; padding: 40px 32px; box-shadow: 0 4px 8px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);">
    <h1 style="margin: 0 0 8px; font-size: 24px; line-height: 30px; font-weight: 600; color: #171717;">Log in to continue</h1>
    <p style="margin: 0 0 28px; font-size: 14px; line-height: 22px; color: #404040; text-wrap: pretty;">You’ll need an account to register, track, or update your voter details.</p>

    <form on-submit="{{ onSubmit }}" style="display: flex; flex-direction: column; gap: 20px;">
      <div>
        <label for="phone" style="display: block; margin-bottom: 6px; font-size: 13px; line-height: 18px; font-weight: 500; color: #171717;">Mobile number</label>
        <div style="display: flex; align-items: center; border: 1px solid #737373; border-radius: 8px; background: #FFFFFF; overflow: hidden;">
          <span aria-hidden="true" style="display: flex; align-items: center; min-height: 48px; padding: 0 12px; border-right: 1px solid #E5E5E5; background: #F5F5F5; font-size: 14px; line-height: 20px; color: #404040;">+91</span>
          <input class="ux4g-input ux4g-input-md" id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="98765 43210" style="flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; line-height: 20px; color: #171717;">
        </div>
      </div>
      <button class="ux4g-btn ux4g-btn-primary ux4g-btn-md" type="submit" style="min-height: 48px; border-radius: 8px; border: 1px solid transparent; background: #4A2BC2; color: #FAFAFA; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Send OTP</button>
    </form>

    <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; margin: 24px 0;">
      <span style="flex: 1; height: 1px; background: #E5E5E5;"></span>
      <span style="font-size: 12px; line-height: 16px; color: #737373;">or</span>
      <span style="flex: 1; height: 1px; background: #E5E5E5;"></span>
    </div>

    <a href="#signup" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; line-height: 20px; font-weight: 500; color: #4A2BC2; text-decoration: none;" class-hover="hv-1">Sign up with a new account</a>
  </div>

  <p style="margin: 20px 0 0; max-width: 440px; text-align: center; font-size: 12px; line-height: 18px; color: #737373;">Your data is protected under the ECI’s <a href="#privacy" style="color: #4A2BC2;">privacy policy</a>.</p>
</main>

</div></div>
<script src="assets/js/dc-lite.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
