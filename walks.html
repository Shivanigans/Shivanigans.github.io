<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walks as Shapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* One deliberate visual world, taken from the reference: a pale sage
     ground with the yellow plates sitting on it. Every colour is painted
     explicitly so the page never borrows the host's theme. */
  :root {
    --page:    #efefdf;
    --ink:     #565658;
    --rule:    #1b1b18;
    --ground:  #f9e278;
    --blocks:  #f3b568;
    --path:    #e13a3d;
    --caption: #686136;
    --gutter:  clamp(16px, 5vw, 72px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    line-height: 1.6;
  }
  .inset { max-width: 1320px; margin: 0 auto; padding-inline: var(--gutter); }

  header { padding-block: clamp(48px, 8vw, 104px) clamp(32px, 5vw, 64px); }
  h1 {
    font-size: clamp(3rem, 11vw, 6.5rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1;
    margin: 0 0 clamp(20px, 3vw, 36px);
  }
  .standfirst {
    font-size: clamp(1rem, 2.2vw, 1.5rem);
    line-height: 1.5; margin: 0; max-width: 24ch;
    text-wrap: balance;
  }
  /* The rule runs the full width whilst the words stay inset, as in the
     reference. */
  .divider { border: 0; border-top: 1.5px solid var(--rule); margin: 0; }

  /* Cards are packed into justified rows: each row is scaled so it fills
     the width exactly, and every card keeps its own proportions, so a
     tall walk stays tall. Widths within a row hold their true ratio to
     one another. */
  .gallery {
    display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: var(--gap);
    padding-block: clamp(48px, 7vw, 96px) clamp(72px, 10vw, 140px);
    --gap: clamp(16px, 2vw, 28px);
  }
  .plate {
    flex: 0 0 auto;
    width: var(--card);
    cursor: pointer; border: 0; padding: 0; background: none;
    font: inherit; color: inherit; display: block;
    transition: opacity 0.25s ease;
  }
  .plate svg { width: 100%; height: auto; display: block; }
  .plate:focus-visible { outline: 2px solid var(--path); outline-offset: 6px; }
  .gallery:hover .plate:not(:hover) { opacity: 0.72; }
  .status { font-size: 0.85rem; opacity: 0.55; }

  /* Whilst a walk replays, the ground steps back so the line is what you
     watch. */
  svg.replaying [id$="--blocks"], svg.replaying [id$="--roads"],
  svg.replaying [id$="--wilderness"], svg.replaying [id$="--pauses"],
  svg.replaying [id$="--gaps"] { opacity: 0.25; }
  svg [id$="--blocks"], svg [id$="--roads"], svg [id$="--wilderness"],
  svg [id$="--pauses"], svg [id$="--gaps"],
  svg [id$="--end"] { transition: opacity 0.4s ease; }
  @media (prefers-reduced-motion: reduce) {
    svg [id$="--blocks"], svg [id$="--roads"], svg [id$="--wilderness"],
    svg [id$="--pauses"], svg [id$="--gaps"],
    svg [id$="--end"] { transition: none; }
  }
  @media (max-width: 560px) {
    .plate { width: 100% !important; }
  }
</style>
</head>
<body>
<header class="inset">
  <h1>Walks</h1>
  <p class="standfirst">A documentation of walks and the shapes created on
     the way.</p>
  <p class="status" style="margin:18px 0 0">Click a walk to watch it happen.</p>
</header>
<hr class="divider">

<div class="inset">
  <div class="gallery" id="gallery">
    <p class="status">Loading walks…</p>
  </div>
</div>

<script>
const GALLERY = "plates/gallery.json";

// Rows aim for this height and are then scaled to fill the width exactly.
const TARGET_ROW = 540;

// A row is never squeezed below this, or the captions inside the plates
// become too small to read.
const MIN_ROW = 340;

// Nor stretched past this, which happens when one wide card sits alone.
const MAX_ROW = 760;

function replaySeconds(metres) {
  return Math.min(9, 2.4 + Math.sqrt(metres) / 26);
}

// Every plate is a standalone file carrying the same layer names, so once
// several are inlined into one page those ids collide. The clip path is
// the dangerous one: a second plate asking for url(#frame) is handed the
// first plate's frame and gets clipped to the wrong shape.
function makeIdsUnique(svg, key) {
  const tag = key.replace(/[^a-z0-9]+/gi, "-");
  const renamed = new Map();
  svg.querySelectorAll("[id]").forEach(el => {
    renamed.set(el.id, tag + "--" + el.id);
    el.id = tag + "--" + el.id;
  });
  svg.querySelectorAll("*").forEach(el => {
    for (const attr of el.attributes) {
      const match = /^url\(#(.+)\)$/.exec(attr.value.trim());
      if (match && renamed.has(match[1])) {
        el.setAttribute(attr.name, "url(#" + renamed.get(match[1]) + ")");
      }
    }
  });
}

async function build() {
  const holder = document.getElementById("gallery");
  let walks;
  try {
    const res = await fetch(GALLERY);
    if (!res.ok) throw new Error(res.status);
    walks = await res.json();
  } catch (err) {
    holder.innerHTML = '<p class="status">Could not load the plates.</p>';
    return;
  }

  holder.innerHTML = "";

  for (const walk of walks) {
    const card = document.createElement("button");
    card.className = "plate";
    card.dataset.ratio = walk.width / walk.height;
    card.setAttribute("aria-label", "Replay " + walk.name);
    card.innerHTML = '<p class="status">' + walk.name + '…</p>';
    holder.appendChild(card);

    try {
      const markup = await (await fetch("plates/" + walk.file)).text();
      card.innerHTML = markup;
      const svg = card.querySelector("svg");
      svg.removeAttribute("width");
      svg.removeAttribute("height");
      makeIdsUnique(svg, walk.file);
      card.addEventListener("click", () => replay(svg, walk));
    } catch (err) {
      card.innerHTML = '<p class="status">' + walk.name + ' failed to load.</p>';
    }
  }

  layout();
  window.addEventListener("resize", layout);
}

// Fill each row exactly. Cards are taken in order until they would
// overflow at the target height, then the row is scaled to fit the width
// it actually has. The last row keeps the target height rather than being
// stretched across the page on its own.
function layout() {
  const holder = document.getElementById("gallery");
  const cards = [...holder.querySelectorAll(".plate")];
  if (!cards.length) return;

  const width = holder.clientWidth;
  const gap = parseFloat(getComputedStyle(holder).columnGap) || 0;
  if (width < 560) {                       // one card per row on a phone
    cards.forEach(c => (c.style.width = ""));
    return;
  }

  let row = [], ratios = 0;
  const place = (stretch) => {
    if (!row.length) return;
    const free = width - gap * (row.length - 1);
    let height = stretch ? free / ratios : TARGET_ROW;
    height = Math.max(MIN_ROW, Math.min(MAX_ROW, height));
    row.forEach(c => {
      c.style.width = Math.floor(Number(c.dataset.ratio) * height) + "px";
    });
    row = []; ratios = 0;
  };

  // Fill a row past the width first, then scale it down to fit. Checking
  // before adding would break rows early and leave a card stranded on a
  // line of its own.
  for (const card of cards) {
    row.push(card);
    ratios += Number(card.dataset.ratio) || 1;
    if (ratios * TARGET_ROW + gap * (row.length - 1) >= width) place(true);
  }
  // The final row is stretched only when it is nearly full already, so a
  // lone card is not blown up across the whole page.
  place(ratios * TARGET_ROW >= width * 0.6);
}

function replay(svg, walk) {
  const strokes = [...svg.querySelectorAll('[id$="--path"] polyline')];
  if (!strokes.length || svg.dataset.running === "yes") return;
  svg.dataset.running = "yes";
  svg.classList.add("replaying");

  const endDot = svg.querySelector('[id$="--end"]');
  if (endDot) endDot.style.opacity = "0";

  // Share the time between stretches by length, so the line moves at a
  // steady pace instead of racing the short ones.
  const lengths = strokes.map(s => s.getTotalLength());
  const total = lengths.reduce((a, b) => a + b, 0) || 1;
  const seconds = replaySeconds(walk.distance);

  strokes.forEach((stroke, i) => {
    stroke.style.transition = "none";
    stroke.style.strokeDasharray = lengths[i];
    stroke.style.strokeDashoffset = lengths[i];
  });
  void svg.getBoundingClientRect();   // make the browser apply that now

  let elapsed = 0;
  strokes.forEach((stroke, i) => {
    const slice = seconds * (lengths[i] / total);
    stroke.style.transition = `stroke-dashoffset ${slice}s linear ${elapsed}s`;
    stroke.style.strokeDashoffset = "0";
    elapsed += slice;
  });

  window.setTimeout(() => {
    svg.classList.remove("replaying");
    if (endDot) endDot.style.opacity = "1";
    strokes.forEach(stroke => {
      stroke.style.transition = "none";
      stroke.style.strokeDasharray = "";
      stroke.style.strokeDashoffset = "";
    });
    svg.dataset.running = "no";
  }, (elapsed + 0.45) * 1000);
}

build();
</script>
</body>
</html>
